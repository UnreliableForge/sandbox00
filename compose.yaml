# 本番環境に近い（？）環境で起動。あまり使わないと思うけど、一応作っておきましょう。
# 開発やE2Eとは別なコンテナが起動します。
# 同時に起動できるようにするため、ポート番号を変更しています。
# ビルドは行わないので、あらかじめビルドしておくこと。

name: sandbox00R

services:

  # ビルドしたjarで起動。
  # イメージbackend00にはbackend.jarが入っていますが、imageを作り直すのはめんどくさいので、マウントしたものを使用しています。
  # imageではなく、Dockerfile を指定すればいいだけのような気がするけど、ローカル環境なので、これでよしとする。
  # 直接このサービスへアクセスすることはできません。
  backend:
    image: backend00:latest
    environment:
      - AWS_REGION=ap-northeast-1
      - SPRING_PROFILES_ACTIVE=local
      - DB_HOST=db
    volumes:
      - ./aws/backend.jar:/app/backend.jar
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "curl", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # nginxは fontendのdistをマウントしています。
  # S3とCloudFrontでホストするので、distをコピーしたイメージがあっても本番でも使用しないので、マウントで行います。
  frontend:
    image: public.ecr.aws/nginx/nginx:latest
    ports:
      - "8001:8000"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  # portsは必要ありませんが、一応つけておきます。
  db:
    image: public.ecr.aws/docker/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sandbox00
      MYSQL_USER: sandbox
      MYSQL_PASSWORD: sandbox
    ports:
     - "3307:3306"
    volumes:
      - db_data_r:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data_r:
