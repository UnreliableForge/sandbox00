# E2Eテスト用の設定。
# テストコードに
# @ActiveProfiles("e2e")
# があるクラスは、このプロパティファイルが使用される。
# AWS Codebuild上でテストを行う際に、別なprofileが必要になる場合、テスト実行時にprofileを指定する。
# ./mvnw test -Dspring.profiles.active=awse2e
# この場合、 application-awse2e.propertes　を作成しておくこと。
spring.application.name=backend
spring.docker.compose.enabled=false

management.endpoints.web.exposure.include=*

logging.level.root=INFO
logging.level.com.unreliableforge=DEBUG
